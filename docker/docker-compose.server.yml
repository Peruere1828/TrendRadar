name: trendradar-jjy

services:
  trendradar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trendradar-jjy:server
    container_name: trendradar-jjy
    restart: unless-stopped
    ports:
      - "0.0.0.0:7000:7000"
    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output
    environment:
      - TZ=Asia/Shanghai
      - WEBSERVER_PORT=7000
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL:-}
      - WEWORK_WEBHOOK_URL=${WEWORK_WEBHOOK_URL:-}
      - WEWORK_MSG_TYPE=${WEWORK_MSG_TYPE:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - EMAIL_SMTP_SERVER=${EMAIL_SMTP_SERVER:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-}
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - BARK_URL=${BARK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}
      - GENERIC_WEBHOOK_TEMPLATE=${GENERIC_WEBHOOK_TEMPLATE:-}
      - AI_ANALYSIS_ENABLED=${AI_ANALYSIS_ENABLED:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_BASE=${AI_API_BASE:-}
      - ARTICLE_CONTENT_ENABLED=${ARTICLE_CONTENT_ENABLED:-}
      - ARTICLE_CONTENT_INCLUDE_HOTLIST=${ARTICLE_CONTENT_INCLUDE_HOTLIST:-}
      - ARTICLE_CONTENT_INCLUDE_RSS=${ARTICLE_CONTENT_INCLUDE_RSS:-}
      - ARTICLE_CONTENT_ONLY_NEW=${ARTICLE_CONTENT_ONLY_NEW:-}
      - ARTICLE_CONTENT_MAX_ARTICLES=${ARTICLE_CONTENT_MAX_ARTICLES:-}
      - ARTICLE_CONTENT_MAX_CHARS=${ARTICLE_CONTENT_MAX_CHARS:-}
      - ARTICLE_CONTENT_TIMEOUT=${ARTICLE_CONTENT_TIMEOUT:-}
      - ARTICLE_CONTENT_MIN_INTERVAL=${ARTICLE_CONTENT_MIN_INTERVAL:-}
      - ARTICLE_CONTENT_USE_JINA=${ARTICLE_CONTENT_USE_JINA:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/30 * * * *}
      - RUN_MODE=${RUN_MODE:-cron}
      - IMMEDIATE_RUN=${IMMEDIATE_RUN:-true}

  trendradar-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    image: trendradar-mcp-jjy:server
    container_name: trendradar-mcp-jjy
    restart: unless-stopped
    ports:
      - "0.0.0.0:7001:3333"
    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output
    environment:
      - TZ=Asia/Shanghai
      - MCP_PORT=3333
